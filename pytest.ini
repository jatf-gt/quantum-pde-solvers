[pytest]
pythonpath = .              # Point pytest to the root of the project so that it can find the modules to test
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
markers =
    slow: marks tests as slow (> 60s) — run with -m slow
    quantum: marks tests that run quantum circuits