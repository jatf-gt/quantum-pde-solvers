[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
markers =
    quantum: identifies tests that construct and simulate quantum circuits,
        necessitating a functional Qiskit/PennyLane backend. Deselect using
        -m "not quantum" for a purely classical run covering problem
        assembly, classical solvers, and the outer-iteration layer.
    autograd: PennyLane interface marker, applied by PennyLane's internal import-time
        interface detection; registered defensively to prevent --strict-markers
        from raising an exception.
    torch: PennyLane interface marker, see 'autograd' above.
    tf: PennyLane interface marker, see 'autograd' above.
    jax: PennyLane interface marker, see 'autograd' above.
    all_interfaces: PennyLane interface marker, see 'autograd' above.
    qchem: PennyLane submodule marker, see 'autograd' above.
    qcut: PennyLane submodule marker, see 'autograd' above.