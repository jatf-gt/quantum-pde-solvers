[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
markers =
    quantum: marks tests that build and simulate quantum circuits, and so
        require a working Qiskit/PennyLane backend. Deselect with
        -m "not quantum" for a pure-classical run covering the problem
        assembly, the classical solvers and the whole outer-iteration layer.
    autograd: PennyLane interface marker, applied by PennyLane's own import-time
        interface detection; registered defensively so --strict-markers doesn't
        reject it.
    torch: PennyLane interface marker, see 'autograd' above.
    tf: PennyLane interface marker, see 'autograd' above.
    jax: PennyLane interface marker, see 'autograd' above.
    all_interfaces: PennyLane interface marker, see 'autograd' above.
    qchem: PennyLane submodule marker, see 'autograd' above.
    qcut: PennyLane submodule marker, see 'autograd' above.